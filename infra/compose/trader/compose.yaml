# Local operation of the PAPER trader (WP-230).
#
# A FRAGMENT, not a second stack: it declares the two dependencies §4.2 names as
# the trader's failure boundaries — Redis (the WP-060 event-bus transport) and
# PostgreSQL (the WP-040 schema) — pinned to the same images the root
# `docker-compose.yml` uses, so a developer runs one server of each rather than
# two versions of each.
#
# NOTHING HERE IS REQUIRED BY ANY TEST. The trader's integration suite
# (`pnpm --filter @polymarket-bot/trader test:integration`) runs entirely
# offline: §4.2's Redis and PostgreSQL boundaries are exercised against the
# PORTS with failure injection, which is the WP-120 precedent for the same class
# of claim. This file exists for LOCAL OPERATION only.
#
# SAFETY — and it is structural, not a promise.
#
#   * The trader is PAPER only. `apps/trader/src/safety.ts` refuses to start
#     under a raised MAX_RUN_MODE, under a run mode that places real orders or
#     needs a live signer, or in an environment that so much as REFERENCES a
#     production secret name (§15, ADR-010 §3, venue report §16).
#   * NO CREDENTIAL, SIGNER, WALLET OR API KEY appears in this file, and none is
#     representable in the trader's configuration schema. Execution is
#     SIMULATED: the only ExecutionVenue the process can be handed is
#     `packages/simulation`'s, which refuses EXECUTION_PROBE, LIVE_MICRO and
#     LIVE by name.
#   * The repository's run-mode defaults — MAX_RUN_MODE=PAPER,
#     ALLOW_REAL_ORDERS=false, LIVE_MICRO_MAX_ORDER_NOTIONAL=0,
#     LIVE_MICRO_MAX_ACCOUNT_EXPOSURE=0 — are set here EXPLICITLY rather than
#     left to a default, so an operator reading this file sees the boundary
#     rather than having to know it.
#   * NO PUBLIC NETWORK EXPOSURE (§15): every published port binds to
#     127.0.0.1.
#
# Usage (from the repository root):
#   docker compose -f infra/compose/trader/compose.yaml up -d
#   pnpm --filter @polymarket-bot/storage-postgres db:migrate
#   TRADER_CONFIG_PATH=infra/compose/trader/trader.config.example.json \
#     REDIS_URL=redis://127.0.0.1:6379 \
#     DATABASE_URL=postgres://devlocal:devlocal@127.0.0.1:5432/polymarket_bot_dev \
#     pnpm --filter @polymarket-bot/trader start
#
# The trader CONSUMES the normalized event stream; it does not produce one, so a
# useful local run also needs `apps/data-gateway` publishing into the same Redis
# (see infra/compose/data-gateway/README.md).
name: polymarket-bot-trader

services:
  redis:
    image: redis:7.4.2-alpine
    container_name: polymarket-bot-trader-redis
    # Append-only persistence, matching the root stack: the transport's
    # retention bound is a SAFETY parameter (ADR-003), and losing the stream to
    # a container restart turns an ordinary restart into a hard resync plus an
    # authoritative-snapshot cycle — which the trader correctly halts on.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${PMB_TRADER_REDIS_PORT:-6379}:6379"
    volumes:
      - trader-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17.5-alpine
    container_name: polymarket-bot-trader-postgres
    environment:
      # DEV-LOCAL ONLY, and deliberately not a secret: these credentials open a
      # throwaway container bound to the loopback interface. They are NOT a
      # production secret name (ADR-010 §3 enumerates those, and none appears
      # here), and the trader's own startup check would refuse the process if
      # one did.
      POSTGRES_USER: devlocal
      POSTGRES_PASSWORD: devlocal
      POSTGRES_DB: polymarket_bot_dev
    ports:
      - "127.0.0.1:${PMB_TRADER_POSTGRES_PORT:-5432}:5432"
    volumes:
      - trader-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devlocal -d polymarket_bot_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  trader-redis-data:
  trader-postgres-data:
