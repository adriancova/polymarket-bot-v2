  - id: WP-100
    phase: phase-1
    title: Polymarket RTDS Chainlink TWAP adapter
    goal: Normalize current 30-second and 60-second Chainlink TWAP events from RTDS.
    depends_on: [WP-000, WP-020, WP-030]
    # Ordering note (2026-08-26, architecture audit M8): these allowed paths are
    # a strict subset of WP-070's packages/polymarket-public/**. WP-100 must run
    # only after WP-070 is merged — never concurrently — per the AGENTS.md
    # path-exclusivity rule. WP-100 may add the dependency declarations its RTDS
    # subtree mechanically requires to packages/polymarket-public/package.json
