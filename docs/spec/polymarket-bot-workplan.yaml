      - market lifecycle projection
    acceptance:
      - TWAP market cannot use terminal-spot payoff model.
      - 50/50 resolution is supported.
      - Unverified settlement spec blocks model-dependent activation.
      - Parameter changes create immutable history.
    gate: automated

  - id: WP-120
    phase: phase-1
    title: Data gateway integration
    goal: Assemble adapters, WAL, normalization, transport, and staleness/resync behavior in the independent gateway process.
    depends_on: [WP-050, WP-060, WP-070, WP-080, WP-090, WP-100, WP-110]
    allowed_paths:
