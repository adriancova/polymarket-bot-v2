    title: Venue verification and sanitized fixtures
    goal: Verify current official Polymarket integration behavior and freeze sanitized fixtures without placing real orders.
    depends_on: []
    allowed_paths:
      - docs/venue/**
      - test/fixtures/venue/**
      - apps/ops-cli/src/verify-venue/**
      # Ratified 2026-08-24 after adversarial review (round 2, M4): the complete
      # structured implementer handoff must be committed in-repo so independent
      # review can verify it pre-merge (WP-010 precedent: docs/handoffs/WP-010.md).
      - docs/handoffs/WP-000.md
    forbidden_paths:
      - packages/domain/**
      - packages/polymarket-secure/**
      - db/migrations/**
    deliverables:
      # Ratified 2026-08-24 (recorded in IMPLEMENTATION_STATUS.md deviations;
      # workplan comment added 2026-08-26 at Wave 0 closeout per the
      # protected-contracts §5 mechanism): the literal below is a template dated
      # at plan generation; the actual report is docs/venue/verified-2026-08-24.md,
      # dated to the real verification per handoff §1.2.
      - docs/venue/verified-2026-08-18.md
      - sanitized public market and WebSocket fixtures
      - sanitized order/user-stream schema fixtures
      - verification CLI skeleton
    acceptance:
      - All venue statements cite official sources.
      - Archived SDKs are explicitly rejected.
      - No production signer or real order is used.
      - Fixtures cover market events, user events, delayed orders, heartbeat, fees, limits, geoblock, and position operations.
    gate: automated

  - id: WP-010
    phase: phase-0
