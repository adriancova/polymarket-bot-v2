version: "2.0.0"
project: polymarket-crypto-trading-platform
status: implementation-baseline
generated_at: "2026-08-18"
primary_spec: polymarket-bot-orchestrator-handoff.md

defaults:
  maximum_run_mode: PAPER
  allow_real_orders: false
  orchestrator_max_parallel_agents: 4
  require_clean_worktree: true
  require_tests_before_handoff: true
  time_based_gates_may_be_simulated: false

protected_paths:
  - packages/domain/**
  - packages/decimal/**
  - db/migrations/**
  - docs/adr/**
  - pnpm-lock.yaml
  - package.json
  - tsconfig.base.json
  - docker-compose.yml
  # Ratified 2026-08-23: root ESLint flat config gates every package's lint;
  # created under WP-010 ownership (see docs/handoffs/WP-010.md).
  - eslint.config.mjs

# Ratified 2026-08-26 (Wave 0 closeout, architecture audit M7): the root test
# runner (test/vitest.config.ts, WP-010-owned) does not yet execute
# test/contract/**, test/fault-injection/**, test/replay-golden/**, test/e2e/**,
# or test/soak/**. A package whose allowed_paths include such a tree may extend
# test/vitest.config.ts (or add an equivalently wired config plus root script)
# with the minimal registration needed to run its own declared test tree; the
# registration diff is part of that package's reviewed candidate.

required_handoff_fields:
  - summary
  - files_changed
  - tests_run
  - assumptions
  - deviations
  - known_risks
  - follow_up

phases:
  - id: phase-0
    name: repository-and-venue-verification
    maximum_run_mode: PAPER
  - id: phase-1
    name: recording-ready
    maximum_run_mode: PAPER
  - id: phase-2
    name: paper-ready-core
    maximum_run_mode: PAPER
  - id: phase-3
    name: live-micro-ready-infrastructure
    maximum_run_mode: PAPER
  - id: phase-4
    name: execution-probes
    maximum_run_mode: EXECUTION_PROBE
  - id: phase-5
    name: live-micro
    maximum_run_mode: LIVE_MICRO

work_packages:
  - id: WP-000
    phase: phase-0
    title: Venue verification and sanitized fixtures
    goal: Verify current official Polymarket integration behavior and freeze sanitized fixtures without placing real orders.
    depends_on: []
    allowed_paths:
      - docs/venue/**
      - test/fixtures/venue/**
      - apps/ops-cli/src/verify-venue/**
      # Ratified 2026-08-24 after adversarial review (round 2, M4): the complete
      # structured implementer handoff must be committed in-repo so independent
      # review can verify it pre-merge (WP-010 precedent: docs/handoffs/WP-010.md).
      - docs/handoffs/WP-000.md
    forbidden_paths:
      - packages/domain/**
      - packages/polymarket-secure/**
      - db/migrations/**
    deliverables:
      # Ratified 2026-08-24 (recorded in IMPLEMENTATION_STATUS.md deviations;
      # workplan comment added 2026-08-26 at Wave 0 closeout per the
      # protected-contracts §5 mechanism): the literal below is a template dated
      # at plan generation; the actual report is docs/venue/verified-2026-08-24.md,
      # dated to the real verification per handoff §1.2.
      - docs/venue/verified-2026-08-18.md
      - sanitized public market and WebSocket fixtures
      - sanitized order/user-stream schema fixtures
      - verification CLI skeleton
    acceptance:
      - All venue statements cite official sources.
      - Archived SDKs are explicitly rejected.
      - No production signer or real order is used.
      - Fixtures cover market events, user events, delayed orders, heartbeat, fees, limits, geoblock, and position operations.
    gate: automated

  - id: WP-010
    phase: phase-0
    title: Monorepo, CI, compose, and quality gates
    goal: Create a reproducible pnpm/TypeScript workspace and local infrastructure baseline.
    depends_on: []
    allowed_paths:
      - apps/**
      - packages/**
      - python/**
      - infra/**
      - test/**
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - tsconfig.base.json
      - docker-compose.yml
      # Ratified 2026-08-23 after adversarial review: ESLint flat config must
      # sit at the repo root to serve the WP-010 lint-gate deliverable.
      - eslint.config.mjs
      - .github/**
      - AGENTS.md
      - IMPLEMENTATION_STATUS.md
    forbidden_paths:
      - docs/venue/verified-*.md
    deliverables:
      - installable monorepo
      - strict TypeScript configuration
      - lint, typecheck, test, and integration commands
      - PostgreSQL and Redis local compose
      - Python uv workspace
    acceptance:
      - pnpm install --frozen-lockfile succeeds.
      - pnpm typecheck succeeds.
      - pnpm lint succeeds.
      - pnpm test succeeds.
      - No live credentials are required.
    gate: automated

  # Added 2026-08-26 by the orchestrator at Wave 0 closeout: the
  # dependency-direction contract (docs/contracts/dependency-direction.md §6)
  # specifies a mechanically implementable check whose owner was unassigned —
  # flagged by both closeout audits as required before Wave 1 adds package
  # edges. package.json and .github/** edits are confined to wiring the check
  # (WP-010 eslint.config.mjs precedent for protected paths serving a
  # deliverable).
  - id: WP-015
    phase: phase-1
    title: Dependency-direction CI enforcement
    goal: Implement the docs/contracts/dependency-direction.md §6 check (cycles, layer conformance, same-layer allowlist, forbidden specifiers) and wire it into the root scripts and CI.
    depends_on: [WP-030]
    allowed_paths:
      - tools/check-dependency-direction.mjs
      - test/unit/tooling/**
      - package.json
      - .github/workflows/ci.yml
      - docs/handoffs/WP-015.md
    forbidden_paths:
      - packages/**
      - apps/**
      - db/migrations/**
      - docs/contracts/**
    deliverables:
      - dependency-direction check script
      - root script and CI wiring
      - unit tests over fixture graphs
    acceptance:
      - The check passes on the current repository (S0 edge permitted).
      - Seeded violations of each rule class (cycle, upward edge, unlisted same-layer edge, forbidden specifier, unclassified package) fail with actionable output.
      - No live credentials are required.
    gate: automated

  - id: WP-020
    phase: phase-0
    title: Domain contracts and exact decimal types
    goal: Freeze versioned event, identifier, decimal, strategy, intent, and run-mode contracts.
    depends_on: [WP-010]
    allowed_paths:
      - packages/domain/**
      - packages/decimal/**
      - test/unit/domain/**
      - test/unit/decimal/**
      - docs/contracts/domain.md
      # Ratified 2026-08-26 by the orchestrator: adding WP-020's declared
      # dependencies (zod, decimal.js, fast-check) to its two owned packages
      # mechanically updates the root lockfile; WP-020 may modify
      # pnpm-lock.yaml for that purpose only (WP-010 eslint.config.mjs
      # precedent for a protected path serving a package's deliverable).
      - pnpm-lock.yaml
      # Ratified 2026-08-26: complete structured implementer handoff committed
      # in-repo for pre-merge independent review (WP-000 M4 precedent).
      - docs/handoffs/WP-020.md
    forbidden_paths:
      - apps/**
      - packages/polymarket-secure/**
      - db/migrations/**
    deliverables:
      - Zod schemas and inferred TypeScript types
      - exact decimal wrapper and canonicalization
      - schema versioning utilities
      - unit and property tests
    acceptance:
      - No economic schema accepts JavaScript number.
      - Scientific notation is rejected.
      - Canonical decimal hashing is deterministic.
      - Event envelopes include gateway epoch and ingest sequence.
      - DecisionResult persists zero or more intents.
    gate: automated

  - id: WP-030
    phase: phase-0
    title: Initial ADR and contract documentation
    goal: Record the locked architecture decisions and integration boundaries.
    depends_on: [WP-000, WP-020]
    allowed_paths:
      - docs/adr/**
      - docs/contracts/**
      - IMPLEMENTATION_STATUS.md
      # Ratified 2026-08-26: complete structured implementer handoff committed
      # in-repo for pre-merge independent review (WP-000/WP-010/WP-020 precedent).
      - docs/handoffs/WP-030.md
    forbidden_paths:
      - apps/**
      - packages/**
      - db/migrations/**
    deliverables:
      - ADR-001 through ADR-012
      - dependency-direction documentation
      - protected-contract policy
    acceptance:
      - ADRs match the primary specification.
      - Venue facts defer to the current verification report.
      - No ADR silently weakens live safety defaults.
    gate: review

  - id: WP-040
    phase: phase-1
    title: PostgreSQL schemas and migrations
    goal: Implement the catalog, data, strategy, execution, accounting, and ops schemas with required constraints.
    depends_on: [WP-020, WP-030]
    allowed_paths:
      - db/migrations/**
      - packages/storage-postgres/**
      - test/integration/postgres/**
      # Ratified 2026-08-26 (WP-020 precedent): mechanical lockfile update from
      # this package's declared dependencies only; and the in-repo structured
      # handoff for pre-merge review.
      - pnpm-lock.yaml
      - docs/handoffs/WP-040.md
    forbidden_paths:
      - packages/domain/**
      - apps/trader/**
    deliverables:
      - forward and rollback migrations
      - typed repositories for shared records
      - append-only enforcement for event and ledger tables
    acceptance:
      - Migrations apply from empty database.
      - Fill allocation cannot exceed fill quantity.
      - Ledger transaction must balance per asset.
      - One active live owner per market is constrained.
      - Live orders require a fencing token reference.
    gate: automated

  - id: WP-050
    phase: phase-1
    title: WAL, segment manifests, and crash recovery
    goal: Implement bounded raw-frame ingestion, append-only segment writing, rotation, checksums, and recovery.
    depends_on: [WP-020, WP-030]
    allowed_paths:
      - packages/storage-wal/**
      - test/unit/storage-wal/**
      - test/fault-injection/wal/**
      - docs/contracts/wal-format.md
      # Ratified 2026-08-26 (WP-020 precedent): mechanical lockfile update from
      # this package's declared dependencies only; and the in-repo structured
      # handoff for pre-merge review.
      - pnpm-lock.yaml
      - docs/handoffs/WP-050.md
    forbidden_paths:
      - apps/trader/**
      - packages/domain/**
    deliverables:
      - WAL writer and reader
      - segment rotation
      - checksum sidecars
      - incomplete-record recovery
    acceptance:
      - Crash recovery truncates only an incomplete final record.
      - Full segments validate by record count and SHA-256.
      - Queue overflow is observable and never silently drops frames.
    gate: automated

  - id: WP-060
    phase: phase-1
    title: Redis Streams event transport
    goal: Implement a bounded transport interface and Redis Streams adapter for normalized market events.
    depends_on: [WP-010, WP-020, WP-030]
    allowed_paths:
      - packages/event-bus/**
      - test/integration/event-bus/**
      # Ratified 2026-08-27 (WP-020/WP-040/WP-050 precedent): mechanical lockfile
      # update from this package's declared dependencies only; and the in-repo
      # structured handoff for pre-merge review.
      - pnpm-lock.yaml
      - docs/handoffs/WP-060.md
    forbidden_paths:
      - packages/domain/**
      - apps/data-gateway/**
      - apps/trader/**
    deliverables:
      - transport interface
      - Redis Streams publisher and consumer
      - consumer checkpointing
      - lag and retention metrics
    acceptance:
      - Ordered events remain ordered per gateway epoch.
      - Reconnect resumes from checkpoint within retention.
      - Lag beyond retention returns a hard resync condition.
    gate: automated

  - id: WP-070
    phase: phase-1
    title: Polymarket public market-data adapter
    goal: Normalize current market WebSocket and REST book data into domain events.
    depends_on: [WP-000, WP-020, WP-030]
    allowed_paths:
      - packages/polymarket-public/**
      - test/contract/polymarket-public/**
      # Ratified 2026-08-27 (WP-020/WP-040/WP-050/WP-060 precedent): mechanical
      # lockfile update from this package's declared dependencies only; and the
      # in-repo structured handoff for pre-merge review.
      - pnpm-lock.yaml
      - docs/handoffs/WP-070.md
    forbidden_paths:
      - packages/domain/**
      - packages/polymarket-secure/**
    deliverables:
      - public client wrapper
      - market-channel subscription manager
      - normalized book/trade/tick/lifecycle events
      - snapshot fetcher
    acceptance:
      - All sanitized official fixtures parse.
      # Reworded 2026-08-26 at Wave 0 closeout (architecture audit M3): the
      # original literal ("Absolute-size zero removes a price level") asserted
      # C-1/U-1 as settled fact, contradicting the open-item register
      # (docs/contracts/protected-contracts.md §8) and ADR-002 §8.
      - Book price-change semantics (C-1/U-1 absolute-size zero-removal) are
        confirmed against current official sources or recorded observation;
        on confirmation the provisional rule is ratified, otherwise the affected
        contracts are flagged for an ADR-governed revision. The provisional
        behavior is never asserted as settled without this evidence.
      - Tick-size changes are emitted exactly.
      - No invented venue sequence number is exposed.
    gate: automated

  - id: WP-080
    phase: phase-1
    title: Binance reference adapter
    goal: Normalize required Binance trades and top-of-book streams.
    depends_on: [WP-020, WP-030]
    allowed_paths:
