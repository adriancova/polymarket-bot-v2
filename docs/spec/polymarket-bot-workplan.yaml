      - explicit caps
      - rollback and emergency runbook references
    acceptance:
      - Effective sample size and regime coverage are reported.
      - Core and all-in PnL are separate.
      - Zero unresolved account discrepancies.
      - Human approval is recorded before maximum mode changes.
    gate: human-approval
