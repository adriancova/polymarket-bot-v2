      - MAX_RUN_MODE=PAPER is enforced.
      - Production secret names are rejected.
      - End-to-end paper fixture emits traceable fill and ledger chain.
      - Redis/PostgreSQL failures halt safely.
    gate: automated

  - id: WP-240
    phase: phase-2
    title: Control API and paper dashboards
    goal: Provide authenticated read/control APIs, audit logs, and Grafana dashboards without signer access.
    depends_on: [WP-040, WP-230]
    allowed_paths:
      - apps/control-api/**
      - packages/observability/**
      - infra/grafana/**
      - test/integration/control-api/**
    forbidden_paths:
      - packages/polymarket-secure/**
      - packages/domain/**
    deliverables:
      - strategy/run controls
      - kill-switch controls
      - operations/trading/fidelity dashboards
    acceptance:
      - Control API cannot raise mode above process maximum.
      - Every mutation is audited.
      - No signer is loaded.
    gate: automated

  - id: WP-250
    phase: phase-2
    title: Determinism and paper end-to-end verification
    goal: Adversarially verify the paper-ready core and freeze the Phase 2 evidence report.
    depends_on: [WP-230, WP-240]
    allowed_paths:
      - test/e2e/**
      - test/replay-golden/**
      - docs/experiments/phase-2-verification.md
      - IMPLEMENTATION_STATUS.md
    forbidden_paths:
      - packages/**
      - apps/**
    deliverables:
      - full paper E2E suite
      - deterministic golden output
      - Phase 2 verification report
    acceptance:
      - Traceability chain is complete.
      - Zero unexplained projection difference in fixtures.
      - Time-based paper evidence remains explicitly pending until observed.
    gate: review

  - id: WP-260
    phase: phase-3
    title: Secure unified-SDK adapter and signer boundary
    goal: Wrap the official secure client behind a narrow interface with strict secret isolation.
    depends_on: [WP-000, WP-020, WP-030]
    allowed_paths:
      - packages/polymarket-secure/**
      - test/contract/polymarket-secure/**
      - docs/runbooks/signer.md
    forbidden_paths:
      - packages/domain/**
      - apps/trader/**
    deliverables:
      - secure client factory
      - redacted error mapping
      - signer boundary
      - mockable internal interface
    acceptance:
      - Only this package imports the secure SDK entry points.
      - Secrets and signatures are redacted.
      - Ordinary tests use mocks/fixtures, not real orders.
    gate: security-review

  - id: WP-270
    phase: phase-3
    title: OMS and signed-order persistence
    goal: Implement live order lifecycle, many-to-many attribution, reservations, and unknown-submission recovery.
    depends_on: [WP-190, WP-200, WP-260]
    allowed_paths:
      - packages/oms/**
      - test/unit/oms/**
      - test/fault-injection/oms/**
    forbidden_paths:
      - packages/domain/**
      - apps/trader/**
    deliverables:
      - OMS state machine
      - signed payload persistence
      - submission-attempt protocol
      - cancel/replace flow
    acceptance:
      - Lost response becomes SUBMISSION_UNKNOWN.
      - New salt is not created before authoritative reconciliation.
      - Partial fills release only unused reservations.
    gate: automated

  - id: WP-280
    phase: phase-3
    title: Authenticated user-stream adapter
    goal: Normalize order and trade lifecycle events and expose reconnect state.
    depends_on: [WP-000, WP-260, WP-270]
    allowed_paths:
      - packages/polymarket-secure/src/user-stream/**
      - test/contract/user-stream/**
    forbidden_paths:
      - packages/domain/**
      - packages/oms/**
    deliverables:
      - user-stream subscription manager
      - normalized order/trade events
      - reconnect/gap signals
    acceptance:
      - MATCHED/MINED/CONFIRMED/RETRYING/FAILED fixtures parse.
      - Reconnect always requests reconciliation.
      - No claim of replaying missed events is made.
    gate: automated

  - id: WP-290
    phase: phase-3
    title: Account reconciliation
    goal: Rebuild authoritative account state after startup, reconnect, unknown submissions, and discrepancies.
    depends_on: [WP-200, WP-270, WP-280]
    allowed_paths:
      - packages/oms/src/reconciliation/**
      - packages/ledger/src/reconciliation/**
      - test/fault-injection/reconciliation/**
      - docs/runbooks/reconciliation.md
    forbidden_paths:
      - packages/domain/**
    deliverables:
      - reconciliation coordinator
      - break taxonomy
      - quarantine/resume policy
    acceptance:
      - Ambiguous state never resumes trading.
      - Unmatched actual activity becomes UNATTRIBUTED.
      - Startup recovery works after mid-order crash fixture.
    gate: automated

  - id: WP-300
    phase: phase-3
    title: Collateral inventory and wallet operations
    goal: Track/reserve pUSD and outcome tokens and manage split, merge, redeem, and approval workflows.
    depends_on: [WP-000, WP-200, WP-260]
    allowed_paths:
      - packages/inventory/**
      - test/unit/inventory/**
      - test/contract/wallet-operations/**
    forbidden_paths:
      - packages/domain/**
      - apps/trader/**
    deliverables:
      - inventory manager
      - reservation service
      - wallet operation state machine
    acceptance:
      - Double reservation is impossible.
      - Sell plan requires available outcome-token inventory.
      - Unknown wallet operation triggers reconciliation.
      - No autonomous bridge/withdrawal is implemented.
    gate: automated

  - id: WP-310
    phase: phase-3
    title: Rate-limit budgets and matching-engine modes
    goal: Enforce endpoint/signer budgets and mode-aware retry behavior.
    depends_on: [WP-000, WP-260, WP-270]
    allowed_paths:
      - packages/polymarket-secure/src/rate-limit/**
      - packages/oms/src/restricted-mode/**
      - test/contract/rate-limits/**
    forbidden_paths:
      - packages/domain/**
    deliverables:
      - local token budgets
      - response-header feedback
      - 425/cancel-only/post-only state handling
    acceptance:
      - Safety cancels outrank new orders.
      - Non-post-only order is not blindly retried in post-only mode.
      - Limits are configuration snapshots, not constants.
    gate: automated

  - id: WP-320
    phase: phase-3
    title: Heartbeat health lease, fencing, geoblock, and kill controls
    goal: Ensure only one healthy eligible process can submit/heartbeat live orders.
    depends_on: [WP-260, WP-290, WP-310]
    allowed_paths:
      - apps/trader/src/live-safety/**
      - packages/polymarket-secure/src/heartbeat/**
      - packages/storage-postgres/src/fencing/**
      - test/fault-injection/live-safety/**
    forbidden_paths:
      - packages/domain/**
    deliverables:
      - PostgreSQL fencing lease
      - heartbeat health lease
      - geoblock check
      - kill-switch enforcement
    acceptance:
      - Two live writers cannot both hold authority.
      - Unhealthy-but-running process stops heartbeat.
      - Ambiguous geoblock result blocks new live entries.
      - Paper mode cannot acquire live fencing.
    gate: security-review

  - id: WP-330
    phase: phase-3
    title: Independent emergency operations CLI
    goal: Provide venue-truth account snapshot, reconciliation, and cancellation commands independent of trader memory.
    depends_on: [WP-260, WP-290, WP-320]
    allowed_paths:
      - apps/ops-cli/**
      - test/integration/ops-cli/**
      - docs/runbooks/emergency.md
    forbidden_paths:
