      - cancel-market
      - cancel-all
      - account-snapshot
      - reconcile
      - stop-heartbeat guidance
    acceptance:
      - cancel-all does not require trader state.
      - Output is explicit and audited.
      - Destructive actions require confirmation or explicit noninteractive flag.
    gate: security-review

  - id: WP-340
    phase: phase-3
    title: Live-micro fault-injection verification
    goal: Adversarially test all live-micro infrastructure without enabling real orders by default.
    depends_on: [WP-270, WP-280, WP-290, WP-300, WP-310, WP-320, WP-330]
    allowed_paths:
      - test/fault-injection/live/**
      - test/e2e/live-mock/**
      - docs/experiments/phase-3-verification.md
      - IMPLEMENTATION_STATUS.md
    forbidden_paths:
      - packages/**
      - apps/**
    deliverables:
      - mock-venue chaos suite
      - security and recovery report
    acceptance:
      - Mid-order crashes recover without duplicate exposure.
      - Lost user-stream events reconcile.
      - Heartbeat failure cancels mock open orders.
      - Live maximum defaults remain zero.
    gate: review

  - id: WP-350
    phase: phase-4
    title: Execution-probe planner and hard caps
    goal: Support tiny real calibration orders with non-bypassable caps and no strategy-size escalation.
    depends_on: [WP-340]
    allowed_paths:
      - packages/execution-planner/src/probes/**
      - apps/trader/src/execution-probe/**
      - test/e2e/execution-probe-mock/**
      - docs/runbooks/execution-probes.md
    forbidden_paths:
      - packages/domain/**
    deliverables:
      - maker/taker probe plans
      - cap enforcement
      - probe tagging and allocation
    acceptance:
      - Probe notional and account exposure are hard capped.
      - Probe mode cannot start a normal live strategy.
      - Human gate is required to set caps above zero.
    gate: human-approval

  - id: WP-360
    phase: phase-4
    title: Fill, slippage, cancel, and markout calibration pipeline
    goal: Compare simulated predictions with actual probe/live-micro observations without double counting.
    depends_on: [WP-210, WP-350]
    allowed_paths:
      - python/calibration/**
      - python/reports/**
      - packages/simulation/src/calibration/**
      - docs/experiments/execution-calibration/**
    forbidden_paths:
      - packages/domain/**
      - packages/polymarket-secure/**
    deliverables:
      - calibration datasets
      - conditional fill models
      - divergence reports
    acceptance:
      - Paper fills are not treated as actual fills.
      - Markout remains a diagnostic unless used in a separate stress model.
      - Calibration artifact is versioned and reproducible.
    gate: external-evidence

  - id: WP-370
    phase: phase-5
