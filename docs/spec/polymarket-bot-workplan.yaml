version: "2.0.0"
project: polymarket-crypto-trading-platform
status: implementation-baseline
generated_at: "2026-08-18"
primary_spec: polymarket-bot-orchestrator-handoff.md

defaults:
  maximum_run_mode: PAPER
  allow_real_orders: false
  orchestrator_max_parallel_agents: 4
  require_clean_worktree: true
  require_tests_before_handoff: true
  time_based_gates_may_be_simulated: false

protected_paths:
  - packages/domain/**
  - packages/decimal/**
  - db/migrations/**
  - docs/adr/**
  - pnpm-lock.yaml
  - package.json
  - tsconfig.base.json
  - docker-compose.yml
  # Ratified 2026-08-23: root ESLint flat config gates every package's lint;
  # created under WP-010 ownership (see docs/handoffs/WP-010.md).
  - eslint.config.mjs

# Ratified 2026-08-26 (Wave 0 closeout, architecture audit M7): the root test
# runner (test/vitest.config.ts, WP-010-owned) does not yet execute
# test/contract/**, test/fault-injection/**, test/replay-golden/**, test/e2e/**,
# or test/soak/**. A package whose allowed_paths include such a tree may extend
# test/vitest.config.ts (or add an equivalently wired config plus root script)
# with the minimal registration needed to run its own declared test tree; the
# registration diff is part of that package's reviewed candidate.

# Ratified 2026-09-15 (GOV-2C, closing GOV-2B N6): this seven-field list and
# AGENTS.md's "Required work-package handoff" list DISAGREE — AGENTS.md adds
# an eighth field, commit_sha, which this list has never carried (nor has the
# handoff's §18.2 packet template, of which this list is the snake_case
# transcription). Resolution: AGENTS.md CONTROLS. Its list is a strict
# superset, it is the repository operating rule that binds every agent, and
# commit_sha is the one field the §18.4 merge protocol cannot verify a record
# without; docs/contracts/protected-contracts.md §6 already reads the two as
# a union of eight. The list below is deliberately NOT edited (a governance
# round writes ratification entries, not plan data); a handoff is complete
# when it carries all eight labelled fields, and a reader of this list must
# add commit_sha. The four Wave 2 completion records that carry none of the
# eight as labelled sections (WP-220, WP-230, WP-240, WP-250) — and, as
# measured there, every follow-up and non-governance bounded round since
# 2026-09-05 — are recorded as a dated deviation in IMPLEMENTATION_STATUS.md,
# not rewritten; whether that form is sanctioned with a field mapping is the
# orchestrator's H7 ruling, not this entry's.
required_handoff_fields:
  - summary
  - files_changed
  - tests_run
  - assumptions
  - deviations
  - known_risks
  - follow_up

phases:
  - id: phase-0
    name: repository-and-venue-verification
    maximum_run_mode: PAPER
  - id: phase-1
    name: recording-ready
    maximum_run_mode: PAPER
  - id: phase-2
    name: paper-ready-core
    maximum_run_mode: PAPER
  - id: phase-3
    name: live-micro-ready-infrastructure
    maximum_run_mode: PAPER
  - id: phase-4
    name: execution-probes
    maximum_run_mode: EXECUTION_PROBE
  - id: phase-5
    name: live-micro
    maximum_run_mode: LIVE_MICRO

