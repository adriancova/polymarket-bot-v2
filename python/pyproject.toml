[project]
name = "polymarket-bot-research"
version = "0.0.0"
description = "Python research workspace for the Polymarket bot (statistics, calibration, reports). Never a second strategy implementation."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
