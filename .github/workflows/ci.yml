# WP-010 CI baseline. No credentials or network secrets are required.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# CI-2 (CI1-L5): every job sets `timeout-minutes`. Without it a hung step runs
# to GitHub's 360-minute default, and since GATE1-R4 every gate runs even after
# an earlier one failed, so any gate can hang. Each timeout below is based on
# run 36284366946 (push of de8116d, the latest green push run on `main` when
# CI-2 was cut; job durations from `gh run view 36284366946 --json jobs`). The
# rule: 6x the measured job duration, rounded up to a whole 5 minutes, and never
# under 10 minutes. The floor is for the two short jobs, which are mostly runner
# setup, downloads and image pulls, and one run does not measure how much those
# vary.
jobs:
  node:
    name: TypeScript quality gates
    runs-on: ubuntu-latest
    # Measured 277 s; 6x = 27.7 min -> 30 min (6.5x). The slowest green run of
    # this job so far, PR run 36282501033, took 420 s; 30 min is 4.3x that.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        id: install
        run: pnpm install --frozen-lockfile

      # CI-1 (GATE1-R4): every gate below runs whenever setup succeeded, even
      # after an earlier gate failed, so one red step no longer hides the
      # others' evidence. (The repository's first run, 36279491795, failed at
      # "Unit tests" and skipped all seven gates after it.) `!cancelled()`
      # replaces the implicit `success()`; `steps.install.outcome` keeps every
      # gate off when checkout, the toolchain or the frozen install failed —
      # the install step is itself skipped after an earlier setup failure, so
      # its outcome is then 'skipped', not 'success'. No step sets
      # `continue-on-error`, so any failed gate still fails the job. The gates
      # are independent of one another: each reads only the checkout and
      # node_modules (every typecheck is `--noEmit`; the suites that need a
      # bundle build it inside their own tests).
      #
      # CI-2 (CI1-L5): GATE1-R4 holds per STEP, so a script that is an `&&`
      # chain in the root package.json (`typecheck`, `test:fault`,
      # `test:contract`, `test:integration`; CI-5 made `test:fault` one) runs
      # here as one step per chained command, in the chain's order. Otherwise the chain's first failure would hide the rest
      # of it. Each step runs its command exactly as the chain spells it. The
      # one exception is a bare binary: `tsc` in a package script resolves
      # through the `node_modules/.bin` that `pnpm run` puts on PATH, and a
      # step's shell has no such PATH, so the step runs it through `pnpm exec`.
      # test/unit/tooling/ci-step-split.test.ts fails when these steps and the
      # chains diverge, or when a gate loses its `if:`. It also fails when any
      # other gate runs an `&&` chain as one step: a root script it runs, or
      # its own `run`.
      - name: Typecheck 1/4 - every workspace package (pnpm -r run typecheck)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm -r run typecheck

      - name: Typecheck 2/4 - unit tests and their helpers (test/tsconfig.json)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec tsc -p test/tsconfig.json --noEmit

      - name: Typecheck 3/4 - paper end-to-end suites (test/e2e/tsconfig.json)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec tsc -p test/e2e/tsconfig.json --noEmit

      - name: Typecheck 4/4 - recorder soak harness (test/soak/recorder)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --dir test/soak/recorder run typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      # WP-015: enforces docs/contracts/dependency-direction.md §6 (cycles F9,
      # layer conformance F12/F13, forbidden specifiers F1-F8/F11). No secrets,
      # no network.
      - name: Dependency direction and package boundaries
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check:deps

      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

      # GATE-1 (GOV-2B B6): the six `test/e2e/**` suites are the Phase-2
      # evidence for four Wave 2 checklist items and previously ran in NO gate —
      # they passed only because auditors invoked them by hand. They keep their
      # own runner (`test/e2e/vitest.config.ts`) rather than joining the root
      # runner's include list, because that config's `resolve.alias` block is
      # load-bearing: `test/e2e/**` sits outside every workspace package, so the
      # bare `@polymarket-bot/*` specifiers do not resolve under the root runner
      # (5 of the 6 suites fail to load there). In-process PAPER throughout: no
      # Docker, no network, no credential, no signer.
      - name: Paper end-to-end verification suite (in-process PAPER; no Docker, no network)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test:e2e

      # GATE-1 (GOV-2B N4): §12.4 determinism is a GATE, not a dashboard. The
      # fidelity dashboard's "Replay determinism" panel tells readers this
      # script must pass, so it has to actually run here.
      - name: Replay determinism goldens (order-book and simulation)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test:replay

      # CI-5: the `test:fault` suites, one step each (see the note above the
      # typecheck steps). CI-5 chained the OMS suite (WP-270) and the account
      # reconciliation suite (WP-290) after the WAL suite (WP-050), so one step
      # would let a red OMS suite hide the reconciliation suite. None of the
      # three starts a container. The WAL tree is typechecked by Typecheck 1/4
      # (the storage-wal package's own `typecheck`); the OMS and reconciliation
      # scripts typecheck their own trees (`tsc --noEmit -p …`) before running
      # them, since no typecheck step covers those two trees.
      - name: Fault-injection tests 1/3 - storage-wal WAL (no container)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @polymarket-bot/storage-wal test:fault

      - name: Fault-injection tests 2/3 - OMS crash points and restart (WP-270; no container)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @polymarket-bot/oms test:fault

      - name: Fault-injection tests 3/3 - ledger account reconciliation (WP-290; no container)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @polymarket-bot/ledger test:fault:reconciliation

      # CI-2 (CI1-L5): the `test:contract` suites, one step each (see the note
      # above the typecheck steps). All read offline fixtures. CI-3 added 5/5
      # (WP-260's secure-SDK contract suite, WP260-L1). CI-4 added 6/6 (WP-300's
      # wallet-operations contract suite, WP300-R1-07).
      - name: Venue contract tests 1/6 - Polymarket public market feed and REST (offline fixtures)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @polymarket-bot/polymarket-public test:contract

      - name: Venue contract tests 2/6 - Polymarket RTDS (offline fixtures)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @polymarket-bot/polymarket-public test:contract:rtds

      - name: Venue contract tests 3/6 - Binance (offline fixtures)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @polymarket-bot/binance-adapter test:contract

      - name: Venue contract tests 4/6 - Coinbase (offline fixtures)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @polymarket-bot/coinbase-adapter test:contract

      - name: Venue contract tests 5/6 - Polymarket secure SDK (offline fixtures; no network, no credential)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @polymarket-bot/polymarket-secure test:contract

      - name: Venue contract tests 6/6 - Wallet operations (offline fixtures; no network, no credential)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @polymarket-bot/inventory test:contract

      - name: Recorder soak-harness smoke (bounded, loopback-only; no elapsed-evidence claim)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test:soak-smoke

      # GATE-1 (GOV-2B N5): the threshold is `--audit-level high`, so moderate
      # and low advisories do NOT fail this step. The previous label implied an
      # unqualified scan.
      - name: Dependency vulnerability scan (pnpm lockfile; fails on high and critical only)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm audit --audit-level high

      # CI-2 (CI1-L5): the `test:integration` suites, one step each (see the
      # note above the typecheck steps). CI-2 split six; CI-5 added 7/7.
      #
      # N5, recounted by CI-1 from each chained suite's vitest config and test
      # sources, and re-checked by CI-2: THREE of the six suites start
      # Testcontainers, so their steps need a host Docker daemon.
      # `test/integration/postgres` (14 files, PostgreSQL) and
      # `test/integration/event-bus` (8 files, Redis) start theirs in the
      # config's `globalSetup`. `test/integration/paper-trader` (the trader's
      # suite) has no `globalSetup`; 4 of its 14 files start their own in
      # `beforeAll` (`durable-pnl-snapshot-postgres`,
      # `durable-trader-first-fill-postgres`, `trader-health-endpoint-postgres`:
      # PostgreSQL; `univ-4-gateway-opens-trader-redis`: PostgreSQL and Redis).
      # The other three suites — parquet (4 files, research-worker), data-gateway
      # (12), control-api (10) — start none; with paper-trader's 10 in-memory
      # files, 36 of the 62 files start no container. GATE-1 (GOV-2B N5) wrote
      # "two of them", true at its base; TRDR-2, BOOT-1, TRDR-3 and UNIV-4 then
      # added the four paper-trader files.
      #
      # CI-5 (the CONTROL-1b and CONTROL-2 follow-up) added 7/7: the control
      # API's real-PostgreSQL suite, `test/integration/control-api/postgres`,
      # which has its own config and which 6/7's config excludes. It has no
      # `globalSetup`; 3 of its 4 files start a Testcontainers PostgreSQL in
      # `beforeAll`, through the same `startPostgresContainer` helper and
      # `postgres:16.6-alpine` image as 1/7. CI-5 renumbered the steps
      # above but did not recount the suites: the counts and labels above
      # are CI-1's and CI-2's, at their base.
      - name: Integration tests 1/7 - storage-postgres (Testcontainers PostgreSQL)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @polymarket-bot/storage-postgres test:integration

      - name: Integration tests 2/7 - event-bus (Testcontainers Redis)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @polymarket-bot/event-bus test:integration

      - name: Integration tests 3/7 - research-worker parquet (no container)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @polymarket-bot/research-worker test:integration

      - name: Integration tests 4/7 - data-gateway (no container)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @polymarket-bot/data-gateway test:integration

      - name: Integration tests 5/7 - trader paper-trader (Testcontainers PostgreSQL and Redis in 4 of its 14 files)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @polymarket-bot/trader test:integration

      - name: Integration tests 6/7 - control-api (no container)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @polymarket-bot/control-api test:integration

      - name: Integration tests 7/7 - control-api PostgreSQL (Testcontainers PostgreSQL in 3 of its 4 files)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @polymarket-bot/control-api test:integration:postgres

  compose:
    name: Local infrastructure compose health
    runs-on: ubuntu-latest
    # Measured 16 s; 6x = 1.6 min -> the 10 min floor (37.5x).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Compose config, up --wait, health probes, down
        run: |
          docker compose config --quiet
          docker compose up -d --wait
          docker compose exec -T postgres pg_isready -U devlocal -d polymarket_bot_dev
          docker compose exec -T redis redis-cli ping
          docker compose down

  python:
    name: Python research workspace
    runs-on: ubuntu-latest
    # Measured 26 s; 6x = 2.6 min -> the 10 min floor (23x).
    timeout-minutes: 10
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.2"

      - name: Sync (frozen lockfile)
        id: sync
        run: uv sync --frozen

      # CI-1 (GATE1-R4), as in the `node` job: both gates run whenever the
      # frozen sync succeeded, so a failing Pytest no longer hides the scan.
      # CI-2 r1: test/unit/tooling/ci-step-split.test.ts pins this `if:` on
      # every step after `id: sync`.
      - name: Pytest
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run pytest

      - name: Dependency vulnerability scan (uv lockfile)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: |
          uv export --frozen --no-emit-project --format requirements-txt > /tmp/requirements-audit.txt
          uvx pip-audit --strict -r /tmp/requirements-audit.txt
