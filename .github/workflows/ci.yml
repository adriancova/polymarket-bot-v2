# WP-010 CI baseline. No credentials or network secrets are required.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: TypeScript quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: WAL fault-injection tests
        run: pnpm test:fault

      - name: Dependency vulnerability scan (pnpm lockfile)
        run: pnpm audit --audit-level high

      - name: Integration tests (explicit skip placeholder until WP-040+)
        run: pnpm test:integration

  compose:
    name: Local infrastructure compose health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compose config, up --wait, health probes, down
        run: |
          docker compose config --quiet
          docker compose up -d --wait
          docker compose exec -T postgres pg_isready -U devlocal -d polymarket_bot_dev
          docker compose exec -T redis redis-cli ping
          docker compose down

  python:
    name: Python research workspace
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.2"

      - name: Sync (frozen lockfile)
        run: uv sync --frozen

      - name: Pytest
        run: uv run pytest

      - name: Dependency vulnerability scan (uv lockfile)
        run: |
          uv export --frozen --no-emit-project --format requirements-txt > /tmp/requirements-audit.txt
          uvx pip-audit --strict -r /tmp/requirements-audit.txt
