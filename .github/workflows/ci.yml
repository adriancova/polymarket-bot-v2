# WP-010 CI baseline. No credentials or network secrets are required.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: TypeScript quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # WP-015: enforces docs/contracts/dependency-direction.md §6 (cycles F9,
      # layer conformance F12/F13, forbidden specifiers F1-F8/F11). No secrets,
      # no network.
      - name: Dependency direction and package boundaries
        run: pnpm check:deps

      - name: Unit tests
        run: pnpm test

      # GATE-1 (GOV-2B B6): the six `test/e2e/**` suites are the Phase-2
      # evidence for four Wave 2 checklist items and previously ran in NO gate —
      # they passed only because auditors invoked them by hand. They keep their
      # own runner (`test/e2e/vitest.config.ts`) rather than joining the root
      # runner's include list, because that config's `resolve.alias` block is
      # load-bearing: `test/e2e/**` sits outside every workspace package, so the
      # bare `@polymarket-bot/*` specifiers do not resolve under the root runner
      # (5 of the 6 suites fail to load there). In-process PAPER throughout: no
      # Docker, no network, no credential, no signer.
      - name: Paper end-to-end verification suite (in-process PAPER; no Docker, no network)
        run: pnpm test:e2e

      # GATE-1 (GOV-2B N4): §12.4 determinism is a GATE, not a dashboard. The
      # fidelity dashboard's "Replay determinism" panel tells readers this
      # script must pass, so it has to actually run here.
      - name: Replay determinism goldens (order-book and simulation)
        run: pnpm test:replay

      - name: WAL fault-injection tests
        run: pnpm test:fault

      - name: Venue contract tests (offline fixtures)
        run: pnpm test:contract

      - name: Recorder soak-harness smoke (bounded, loopback-only; no elapsed-evidence claim)
        run: pnpm test:soak-smoke

      # GATE-1 (GOV-2B N5): the threshold is `--audit-level high`, so moderate
      # and low advisories do NOT fail this step. The previous label implied an
      # unqualified scan.
      - name: Dependency vulnerability scan (pnpm lockfile; fails on high and critical only)
        run: pnpm audit --audit-level high

      # GATE-1 (GOV-2B N5): the previous label credited all six chained suites
      # as "Testcontainers - PostgreSQL and Redis". Only two are container
      # backed: `test/integration/postgres` (14 files, PostgreSQL) and
      # `test/integration/event-bus` (8 files, Redis) are the only suites whose
      # vitest config declares a `globalSetup` that starts a container. The other
      # four — data-gateway (11), paper-trader (9), control-api (8), parquet (4),
      # i.e. 32 of the 54 files — start no container.
      - name: Integration tests (six workspace suites; Testcontainers PostgreSQL and Redis in two of them)
        run: pnpm test:integration

  compose:
    name: Local infrastructure compose health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compose config, up --wait, health probes, down
        run: |
          docker compose config --quiet
          docker compose up -d --wait
          docker compose exec -T postgres pg_isready -U devlocal -d polymarket_bot_dev
          docker compose exec -T redis redis-cli ping
          docker compose down

  python:
    name: Python research workspace
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.2"

      - name: Sync (frozen lockfile)
        run: uv sync --frozen

      - name: Pytest
        run: uv run pytest

      - name: Dependency vulnerability scan (uv lockfile)
        run: |
          uv export --frozen --no-emit-project --format requirements-txt > /tmp/requirements-audit.txt
          uvx pip-audit --strict -r /tmp/requirements-audit.txt
