# Local development infrastructure only (WP-010).
# Dev-only credentials below are intentionally obvious placeholders and must
# never be reused anywhere outside a local developer machine.
# Services bind to 127.0.0.1 only.
# Host ports are overridable (PMB_POSTGRES_PORT / PMB_REDIS_PORT) for machines
# where the defaults collide with other local services.
name: polymarket-bot-dev

services:
  postgres:
    image: postgres:16.6-alpine
    container_name: polymarket-bot-postgres-dev
    environment:
      POSTGRES_USER: devlocal
      POSTGRES_PASSWORD: devlocal-only-not-a-secret
      POSTGRES_DB: polymarket_bot_dev
    ports:
      - "127.0.0.1:${PMB_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devlocal -d polymarket_bot_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.2-alpine
    container_name: polymarket-bot-redis-dev
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${PMB_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
